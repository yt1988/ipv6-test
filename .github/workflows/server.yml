# The server (server/): vet, test and build it (linux/amd64, static, no cgo) on every change to it. A change merged
# into main is also published as a GitHub Release, tag server-<short commit>, marked latest, with the binary, its
# nftables table, the unit and SHA256SUMS, so a new machine downloads it instead of building it:
#   https://github.com/yt1988/ipv6-test/releases/latest/download/ipv6-server
# Installing is by hand (AGENTS.md, "Run the server"); nothing here can reach a server.
name: server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ipv6-server .
      - run: sha256sum ipv6-server he.nft 1ms-ipv6.service > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ipv6-server
          path: |
            server/ipv6-server
            server/he.nft
            server/1ms-ipv6.service
            server/SHA256SUMS
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="server-${GITHUB_SHA::7}"
          gh release create "$tag" ipv6-server he.nft 1ms-ipv6.service SHA256SUMS \
            --target "$GITHUB_SHA" --latest --title "ipv6-server ${GITHUB_SHA::7}" \
            --notes "The IPv6 test's server, built from ${GITHUB_SHA::7} (linux/amd64, static). How to download, check and install it: AGENTS.md, \"Run the server\"."
