# The 1ms-ipv6 server (server/): vet, test and build it for the 1ms.dog VPS (linux/amd64, static) on every change to
# it, and keep the binary as the run's artifact. Deploying is by hand: the binary goes up over sftp
# (server/README.md); nothing here can reach the machine.
name: server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ipv6-server .
      - run: sha256sum ipv6-server
      - uses: actions/upload-artifact@v4
        with:
          name: ipv6-server
          path: |
            server/ipv6-server
            server/he.nft
            server/1ms-ipv6.service
