# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public and src/worker.js.
# Files are served first (free and not metered); the Worker only sees shared results (/r/<code>) and unknown paths.
# No routes or custom domain here: on 1ms.dog the site routes the domain to this Worker. To self-host, bind your own
# domain in the dashboard (see README). The domain must be proxied by Cloudflare: the dual-stack test reads this
# site's own /cdn-cgi/trace.
name = "ipv6-test"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"   # the Worker reads a language's page for shared results (/r/<code>)
